name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Full Xcode Project
        run: |
          mkdir -p AntigravityIDE/AntigravityIDE

          # Swift dosyalarını kopyala
          if [ -f AntigravityIDEApp.swift ]; then
            cp AntigravityIDEApp.swift AntigravityIDE/AntigravityIDE/
          elif [ -f ContentView.swift ]; then
            cp ContentView.swift AntigravityIDE/AntigravityIDE/
          else
            cat << 'EOF' > AntigravityIDE/AntigravityIDE/ContentView.swift
          import SwiftUI

          struct ContentView: View {
              var body: some View {
                  Text("Antigravity IDE")
                      .padding()
              }
          }
          EOF
          fi

          # Info.plist oluştur
          cat << 'EOF' > AntigravityIDE/AntigravityIDE/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>AntigravityIDE</string>
              <key>CFBundleIdentifier</key>
              <string>com.antigravity.ide</string>
              <key>CFBundleName</key>
              <string>AntigravityIDE</string>
              <key>CFBundleDisplayName</key>
              <string>Antigravity IDE</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

          # xcodegen ile tam xcodeproj üret
          cd AntigravityIDE
          cat << 'EOF' > project.yml
          name: AntigravityIDE
          options:
            bundlePrefix: com.antigravity
            deploymentTarget:
              iOS: "16.0"
          targets:
            AntigravityIDE:
              type: application
              platform: iOS
              sources: [AntigravityIDE]
              settings:
                base:
                  INFOPLIST_FILE: AntigravityIDE/Info.plist
                  GENERATE_INFOPLIST_FILE: NO
                  PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.ide
                  PRODUCT_NAME: AntigravityIDE
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
                  SWIFT_VERSION: "5.0"
          EOF

          xcodegen generate

      - name: Build with xcodebuild
        run: |
          cd AntigravityIDE
          xcodebuild build \
            -project AntigravityIDE.xcodeproj \
            -scheme AntigravityIDE \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath ./build

      - name: Package Payload to .IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -r AntigravityIDE/build/Build/Products/Release-iphoneos/AntigravityIDE.app Payload/
          zip -r AntigravityIDE.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityIDE-IPA
          path: AntigravityIDE.ipa
